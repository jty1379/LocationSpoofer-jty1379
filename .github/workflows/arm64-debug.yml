name: Build ARM64 Debug APKs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/arm64-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build scoped and global Debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleScopedDebug
          ./gradlew --no-daemon :app:assembleGlobalDebug

      - name: Collect ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          SCOPED_APK=$(find app/build/outputs/apk/scoped/debug -type f -name '*.apk' -name '*arm64-v8a*' | head -n 1)
          GLOBAL_APK=$(find app/build/outputs/apk/global/debug -type f -name '*.apk' -name '*arm64-v8a*' | head -n 1)

          if [ -z "$SCOPED_APK" ] || [ -z "$GLOBAL_APK" ]; then
            echo 'ARM64 APK not found.'
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$SCOPED_APK" dist/LocationSpoofer-scoped-arm64-v8a-debug.apk
          cp "$GLOBAL_APK" dist/LocationSpoofer-global-arm64-v8a-debug.apk
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-arm64-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="arm64-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LocationSpoofer ARM64 Debug #${GITHUB_RUN_NUMBER}" \
            --notes "Automated ARM64-v8a debug build from commit ${GITHUB_SHA}. Includes scoped and global variants."
